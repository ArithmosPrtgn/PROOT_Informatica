<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/bundle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/resources/favicon.svg" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>PROOT - E404</title>
</head>
<body>
    <script src="/js/bundle.js" defer></script>
    <noscript><meta http-equiv="refresh" content="0 url=/err/other/javascript.html"></noscript>
    <h1 id="errorTitle">Erro 404</h1>
    <div id="mainArea">

        <div id="errorWrapper">
            <img id="errorscenary" src="/resources/err/404.webp" alt="Ícone de erro 404: o mascote do site aponta para o canto superior esquerdo, apresentando um sublinhado de ficheiro ao fundo; '404' é escrito dentro deste." />
                <div id="errorContent">
                <h2>A página alvo não existe.</h2>
                <h4>Você pode ter digitado o link errado, tentado acessar uma página que foi removida ou alterada, ou até mesmo ter sido redirecionado incorretamente por um botão.<br>
                Se você identificar que este erro não deveria ter acontecido, <a href="https://github.com/ArithmosPrtgn/PROOT_Informatica/issues">crie um <i>issue</i> no Github.</a></h4>
                <div id="errorOptions">
                    <button onclick="window.history.back()"><span class="material-symbols-rounded iconM iconMNeedsSpace">arrow_back</span>Página anterior</button>
                    <button id="CTAButton" onclick="window.location.href='/'"><span class="material-symbols-rounded iconM iconMNeedsSpace">home</span>Ir para a página inicial</button>
                </div>
            </div>
        </div>
        <div id="errorAltButtons">
            <button id="theme">
            <span id="themeIco" class="material-symbols-rounded icoAniTheme"
                >moon_stars</span>
            </button>
            <button id="accessibility">
            <span id="accessibilityIco" class="material-symbols-rounded iconM"
                >accessibility</span>
            </button>
        </div>
    </div>
</body>
</html>
