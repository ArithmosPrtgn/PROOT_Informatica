<div id="hideContent"></div>
    <div id="settings" class="cal-sans-regular">
        <div id="upperContent">
            <div>
                <h1>MENU</h1>
                <button id="iQuit">
                    <span class="material-symbols-rounded iconMNeedsSpace iconM">close</span>
                    <h4>Sair</h4>
                </button>
            </div>    
            <br>
        <br>
        <div class="optionAccess" id="textSized">
            <div>
                <span aria-hidden="true" class="material-symbols-rounded iconMNeedsSpace iconM">format_size</span>
                <h4>Tamanho de texto:</h4>
            </div>
            <br>
            <div class="slide">
            <input type="range" id="textSize" min="0.5" max="2" value="1" step="0.1">
                <div class="ticks">
                    <span>0.5</span>
                    <span>1</span>
                    <span>1.5</span>
                    <span>2</span>
                </div>
            </div>
        </div>
        <div class="optionAccess">
            <div>
                <span aria-hidden="true" class="material-symbols-rounded iconMNeedsSpace iconM">animation</span>
                <h4>Animações:</h4>
            </div>
            <span class="chck"><input type="checkbox" id="animatedWebsite" checked></span>
        </div>
        <div class="optionAccess">
            <div>
                <span aria-hidden="true" class="material-symbols-rounded iconMNeedsSpace iconM">contrast</span>
                <h4>Alto Contraste:</h4>
            </div>
            <span class="chck"><input type="checkbox" id="highContrast"></span>
        </div>
    </div>
    <div>
        <button class="HBButtons" id="themeComplex">
            <span id="themeIco" class="material-symbols-rounded icoAniTheme iconMNeedsSpace">moon_stars</span>
            <h4>Alternar Modo Escuro</h4>
        </button>
        <button class="HBButtons" id="Retro" onclick="window.location.href='/'">
            <span id="Rico" class="material-symbols-rounded icoAniR iconMNeedsSpace iconM">keyboard_arrow_left</span>
            <h4>Voltar para a página inicial</h4>
        </button>
        <button class="HBButtons" id="saveOffline">
            <span id="saveAsIco" class="material-symbols-rounded iconAniSA iconMNeedsSpace iconM">print</span>
            <h4>Salvar Offline</h4>
        </button>
    </div>
</div>
